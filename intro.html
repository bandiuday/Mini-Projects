<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
        *,
        *::before,
        *::after{
            box-sizing: border-box;
            margin: 0;
            line-height: 1.5;
        }
        .card{
            font-family: "Open Sans", sans-serif;
            background-color: #000;
            color: #fff;
            border: 1px solid black;
            border-radius: 10px;
            width: 600px;
            margin: 100px auto;
            padding: 60px;
            
        }
        .name{
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
        }
        .title{
            color: #fff;
            font-size: 10px;
            margin: 10px 0px;
        }
        .description{
            max-width: 60ch;
            color: #ffffff92;
        }
        .btn{
            background-color: lightgray;
            color: grey;
            margin-top: 16px;
            border:2px solid lightgray;
            border-radius: 10px;
            padding: 8px 16px;
            cursor: pointer;
        }
        strong{
            color:#fff;
            text-transform: capitalize;
        }




    </style>
</head>
<body>
    <div class="card">
        <header>
        <p class="name"><strong>Bandi uday kiran</strong></p>
        </header>
        <h1 class="title"><a href="https://mail.google.com/mail/u/0/#inbox">banduday26@gmail.com</a></h1>
        <p class="description">moving towards the
            <br><strong><a href="https://roadmap.sh/full-stack">full stack web development></a></strong>,and Gen AI.
        </p>
        <button class="btn">Know More</button>
    </div>
</body>
</html>
